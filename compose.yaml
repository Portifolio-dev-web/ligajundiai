services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=512
      MONGO_URL: mongodb://mongodb:27017/ligajundiai
      DB_NAME: ligajundiai
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_node_modules:
  app_next:
  mongo_data:
