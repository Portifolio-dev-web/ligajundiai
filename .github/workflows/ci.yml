# SEGURANÇA (varredura, item S7): não havia CI nenhum — testes, build de produção, varredura de
# segredo e dependências vulneráveis só eram percebidos manualmente, se alguém lembrasse de rodar.
# Credenciais aqui são só para o Postgres efêmero do job (perdido no fim da execução), não segredos
# reais — iguais às já documentadas em backend/.env.example para desenvolvimento local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# SEGURANÇA (varredura, item S26): "contents: read" é o mínimo que todo job aqui precisa (só
# checkout) — nenhum job publica release, comenta PR ou escreve no repositório. "concurrency"
# cancela a execução anterior do mesmo branch/PR quando um push novo chega, em vez de empilhar
# execuções redundantes rodando em paralelo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ligajundiai
          POSTGRES_USER: liga
          POSTGRES_PASSWORD: liga_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liga -d ligajundiai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci
      # SEGURANÇA (varredura, item S25): sem isso, "next build"/"npm test" passando não dizia nada
      # sobre qualidade de código nenhuma — nenhum lint rodava em lugar nenhum.
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Rodar a suíte de testes (unit + integração)
        working-directory: backend
        # test-env.cjs já aponta DATABASE_URL para localhost:5432 com estas mesmas credenciais.
        run: npm test

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar dependências de produção do backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências do frontend (lockfile travado)
        run: corepack enable && yarn install --non-interactive --frozen-lockfile
      # SEGURANÇA (varredura, item S25): mesmo achado do backend — nenhum lint rodava no frontend.
      - name: Lint
        run: yarn lint
      - name: Build de produção
        run: yarn build

  docker-build:
    runs-on: ubuntu-latest
    # SEGURANÇA (varredura, item S23): o CI nunca buildava as imagens Docker de produção — só o
    # "yarn build"/"npm test" rodando fora do Docker. Foi exatamente isso que deixou passar, no Lote
    # 3, um next.config.js que só funcionava com API_INTERNAL_URL resolvido em build time: o build
    # "nu" (fora da imagem) não usa o Dockerfile, então não reproduz o bug. Builda as duas imagens de
    # produção de verdade, com o mesmo build arg que a implantação real usaria.
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção do frontend
        run: >-
          docker build --target production
          --build-arg API_INTERNAL_URL=http://api:4000
          -f Dockerfile .
      - name: Build da imagem de produção do backend
        run: docker build --target production -f backend/Dockerfile .

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências do frontend (lockfile travado)
        run: corepack enable && yarn install --non-interactive --frozen-lockfile
      - name: Auditar dependências do frontend
        # Não falha o build: tailwindcss (3.x, devDependency só de build) ainda arrasta um "braces"
        # sem patch disponível (só corrige migrando para tailwindcss 4) — risco baixo (uso só em
        # build/dev, nunca recebe entrada não confiável), mas o resultado fica visível no log do CI.
        run: yarn audit --level high || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar segredos commitados (gitleaks)
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source=/github/workspace --no-banner -v
